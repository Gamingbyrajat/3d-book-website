<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="164" y1="108" x2="1452" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#E0CFB0"/>
    </linearGradient>
    <linearGradient id="cloth" x1="110" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F343D"/>
      <stop offset="1" stop-color="#1F232B"/>
    </linearGradient>
    <pattern id="threadGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#E7D9BF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2B303A" flood-opacity="0.14"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="116" width="286" height="668" rx="14" fill="url(#cloth)"/>
    <rect x="112" y="116" width="286" height="668" rx="14" fill="url(#threadGrid)"/>

    <path d="M446 244C536 236 644 258 754 322C902 408 1034 452 1150 452C1238 452 1320 428 1398 380" stroke="#B6955F" stroke-width="10" stroke-linecap="round"/>
    <path d="M450 344C542 336 646 366 756 432C906 522 1034 564 1142 564C1238 564 1322 536 1394 486" stroke="#8C6A40" stroke-opacity="0.72" stroke-width="8" stroke-linecap="round"/>

    <path d="M632 626C790 554 942 530 1088 554C1196 572 1298 622 1398 704" stroke="#2B303A" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
    <path d="M550 710C656 666 772 646 900 648C1068 650 1226 694 1378 782" stroke="#B6955F" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g opacity="0.75">
    <circle cx="286" cy="236" r="9" fill="#D7BE90"/>
    <circle cx="286" cy="338" r="9" fill="#D7BE90"/>
    <circle cx="286" cy="442" r="9" fill="#D7BE90"/>
    <circle cx="286" cy="548" r="9" fill="#D7BE90"/>
    <circle cx="286" cy="652" r="9" fill="#D7BE90"/>
  </g>

  <g opacity="0.48">
    <rect x="1096" y="214" width="146" height="8" rx="4" transform="rotate(16 1096 214)" fill="#D0B07D"/>
    <rect x="1204" y="286" width="112" height="8" rx="4" transform="rotate(-12 1204 286)" fill="#CAB188"/>
    <rect x="1240" y="676" width="168" height="8" rx="4" transform="rotate(11 1240 676)" fill="#B89863"/>
  </g>

  <text x="1106" y="784" fill="#635A4E" fill-opacity="0.6" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="0.12em">THE DETAILS</text>

  <rect x="0" y="0" width="1600" height="900" filter="url(#grain)" opacity="0.95"/>
