<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="154" y1="132" x2="1450" y2="794" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF5EA"/>
      <stop offset="1" stop-color="#E3D3B4"/>
    </linearGradient>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="swirl" x1="322" y1="520" x2="1286" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8D6A45" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#2B303A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#B6955F" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#wash)">
    <circle cx="520" cy="344" r="210" fill="#C7A05F" fill-opacity="0.52"/>
    <circle cx="846" cy="286" r="176" fill="#FBF6EA" fill-opacity="0.78"/>
    <circle cx="1056" cy="484" r="230" fill="#46505E" fill-opacity="0.28"/>
    <circle cx="710" cy="564" r="196" fill="#9B7A4D" fill-opacity="0.32"/>
    <circle cx="1228" cy="314" r="168" fill="#D8C29A" fill-opacity="0.5"/>
  </g>

  <path d="M328 566C448 470 586 424 742 426C866 428 994 470 1126 558C1180 594 1234 622 1288 644" stroke="url(#swirl)" stroke-width="12" stroke-linecap="round"/>
  <path d="M404 656C518 590 646 558 788 560C930 562 1060 602 1180 676" stroke="#B6955F" stroke-opacity="0.34" stroke-width="6" stroke-linecap="round"/>
  <path d="M474 252C576 286 670 304 756 306C868 310 984 276 1104 204" stroke="#2B303A" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>

  <circle cx="520" cy="344" r="152" stroke="#8A6942" stroke-opacity="0.2" stroke-width="3"/>
  <circle cx="1056" cy="484" r="170" stroke="#2B303A" stroke-opacity="0.16" stroke-width="3"/>
  <circle cx="710" cy="564" r="126" stroke="#9B7A4D" stroke-opacity="0.18" stroke-width="3"/>

  <text x="1126" y="762" fill="#5E564B" fill-opacity="0.6" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="0.12em">COLOR THEORY</text>

  <rect x="0" y="0" width="1600" height="900" filter="url(#grain)" opacity="0.95"/>
