<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="176" y1="96" x2="1426" y2="832" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF4E9"/>
      <stop offset="0.5" stop-color="#E3D6BF"/>
      <stop offset="1" stop-color="#D1BB93"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(642 358) rotate(22.2) scale(442 338)">
      <stop stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#FFF9EF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="line" x1="288" y1="0" x2="1288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B3925E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B3925E"/>
      <stop offset="1" stop-color="#B3925E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#light)"/>

  <g opacity="0.22">
    <text x="154" y="624" fill="#2B303A" font-family="Georgia, 'Times New Roman', serif" font-size="480" font-style="italic">A</text>
    <text x="560" y="514" fill="#4A4236" font-family="Georgia, 'Times New Roman', serif" font-size="388">R</text>
    <text x="1044" y="644" fill="#2B303A" font-family="Georgia, 'Times New Roman', serif" font-size="476">T</text>
  </g>

  <g filter="url(#blur)" opacity="0.18">
    <circle cx="820" cy="430" r="186" fill="#B6955F"/>
  </g>

  <path d="M286 302H1284" stroke="url(#line)" stroke-width="2"/>
  <path d="M286 604H1284" stroke="url(#line)" stroke-width="2"/>
  <path d="M448 254V688" stroke="#6A5C48" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M798 206V726" stroke="#6A5C48" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M1150 248V698" stroke="#6A5C48" stroke-opacity="0.14" stroke-width="2"/>

  <circle cx="804" cy="452" r="122" stroke="#C2A777" stroke-width="3" stroke-opacity="0.65"/>
  <circle cx="804" cy="452" r="16" fill="#B3925E"/>

  <path d="M646 452H962" stroke="#C2A777" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M804 296V610" stroke="#C2A777" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>

  <text x="1298" y="760" fill="#6F6557" fill-opacity="0.62" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="0.12em">TYPOGRAPHY</text>

  <rect x="0" y="0" width="1600" height="900" filter="url(#grain)" opacity="0.95"/>
